name = "crash-collector"
main = "src/index.js"
compatibility_date = "2024-09-23"

# 這個 Worker 要有公開網址讓遊戲 POST 進來（跟 cf-sync-trigger 只跑 cron 不同）
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "idle-crash"
database_id = "填入 wrangler d1 create idle-crash 之後給的 id"

# 讀取端點(/list、/stats)的金鑰不放這裡：
#   npx wrangler secret put VIEW_KEY
